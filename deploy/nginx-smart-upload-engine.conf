# Nginx reverse proxy for Smart Upload Engine.
# Replace "yourdomain.com" with your actual domain (must already have an
# A record pointing at this VPS's IP address before running certbot).
#
# Install: sudo cp this file to /etc/nginx/sites-available/smart-upload-engine
#          sudo ln -s /etc/nginx/sites-available/smart-upload-engine /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d yourdomain.com   # adds HTTPS automatically

server {
    listen 80;
    server_name yourdomain.com;

    # Allow large file uploads through the reverse proxy — this app streams
    # bytes rather than buffering whole files, but keep this generous so
    # nginx itself doesn't reject big requests/responses.
    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Basic Auth is handled inside the app itself (HTTP Basic), so
        # nothing extra is needed here for login.
        proxy_buffering off;
    }
}
